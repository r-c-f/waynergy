# Windows server -> Linux (evdev) client
#
# Server: Deskflow / Synergy 1.x / Barrier on Windows
# Client: waynergy on a Linux compositor using a standard evdev keymap
#         (tested on Hyprland 0.56 / wlroots, but nothing here is
#         compositor-specific)
#
# Usage: copy the settings below into your config.ini.
#
# Why this exists
# ---------------
# Windows servers send scancode-set-1 codes, with E0-prefixed codes sent as
# the second byte OR'd with 0x100. For the main block, set-1 codes happen to
# be identical to Linux evdev keycodes, and xkb keycode = evdev keycode + 8,
# so a plain offset of 8 is correct for those keys.
#
# The E0-prefixed keys (arrows, navigation cluster, right-hand modifiers,
# keypad Enter/slash) do NOT follow that rule and need the explicit mappings
# below.
#
# Using this instead of an `xkb_keymap` built on doc/xkb/keycodes/win keeps
# the injected keycodes identical to the ones the compositor itself uses,
# which matters if the compositor has keybindings -- see the "Windows primary"
# section of the README.
#
# Every value below is derived from linux/input-event-codes.h as
# (KEY_* value + 8).

wl_keyboard_map = true
xkb_key_offset = 8

[raw-keymap]
offset_on_explicit = false

# raw    xkb   set1    key
284    = 104   # 0x11C  keypad Enter   (KEY_KPENTER    96)
285    = 105   # 0x11D  right Ctrl     (KEY_RIGHTCTRL  97)
309    = 106   # 0x135  keypad /       (KEY_KPSLASH    98)
311    = 107   # 0x137  Print Screen   (KEY_SYSRQ      99)
312    = 108   # 0x138  right Alt      (KEY_RIGHTALT  100)
327    = 110   # 0x147  Home           (KEY_HOME      102)
328    = 111   # 0x148  Up             (KEY_UP        103)
329    = 112   # 0x149  Page Up        (KEY_PAGEUP    104)
331    = 113   # 0x14B  Left           (KEY_LEFT      105)
333    = 114   # 0x14D  Right          (KEY_RIGHT     106)
335    = 115   # 0x14F  End            (KEY_END       107)
336    = 116   # 0x150  Down           (KEY_DOWN      108)
337    = 117   # 0x151  Page Down      (KEY_PAGEDOWN  109)
338    = 118   # 0x152  Insert         (KEY_INSERT    110)
339    = 119   # 0x153  Delete         (KEY_DELETE    111)
347    = 133   # 0x15B  left Super     (KEY_LEFTMETA  125)
348    = 134   # 0x15C  right Super    (KEY_RIGHTMETA 126)
349    = 135   # 0x15D  Menu           (KEY_COMPOSE   127)

# Note on the Super/Windows key
# -----------------------------
# Windows reserves Win+<letter> combinations (Win+D, Win+E, Win+K, Win+L,
# Win+R, ...) for the shell and never forwards them, so the left Super key
# arrives on its own but most combinations using it never reach the client.
#
# If you rely on Super-based keybindings, map the Menu key to Super_L instead
# -- Windows does not reserve Menu+<letter>:
#
#   349 = 133
